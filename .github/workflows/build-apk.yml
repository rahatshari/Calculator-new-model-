name: Build & Release Pure Native Android APK (হিসাব ক্যালকুলেটর)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Release Native Hisab Calculator APK
    runs-on: ubuntu-latest

    steps:
      - name: ১. কোড চেকআউট (Checkout Repository)
        uses: actions/checkout@v4

      - name: ২. Java JDK 21 সেটআপ (Pure Native Android Build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ৩. Gradle 8.9 সেটআপ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: ৪. Android SDK সেটআপ ও লাইসেন্স অনুমোদন
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: ৫. স্বয়ংক্রিয় ভার্সন বৃদ্ধি, অ্যাপ লোগো ও ৫টি অফলাইন বাংলা ফন্ট সংযুক্তি
        run: |
          BUILD_NUM="${{ github.run_number }}"
          NEW_VERSION="1.0.${BUILD_NUM}"
          echo "APP_VERSION=${NEW_VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_ENV

          # প্রি-জেনারেটেড অ্যাপ লোগো কপি নিশ্চিত করা
          if [ -d "assets/android-res" ]; then
            cp -rf assets/android-res/mipmap-* native-android/app/src/main/res/
          fi
          mkdir -p native-android/app/src/main/res/drawable
          if [ -f "public/logo-sm.png" ]; then
            cp -f public/logo-sm.png native-android/app/src/main/res/drawable/app_logo_small.png
          fi

          # ৫টি অফলাইন বাংলা ফন্ট APK-এর assets/fonts/-এ ডাউনলোড করা
          FONT_DIR="native-android/app/src/main/assets/fonts"
          mkdir -p "$FONT_DIR"

          download_font() {
            local url="$1"
            local out="$2"
            if [ ! -s "$out" ]; then
              curl -fsSL "$url" -o "$out" || rm -f "$out"
            fi
          }

          download_font "https://raw.githubusercontent.com/google/fonts/main/ofl/anekbangla/AnekBangla%5Bwdth%2Cwght%5D.ttf" "$FONT_DIR/AnekBangla.ttf"
          download_font "https://raw.githubusercontent.com/google/fonts/main/ofl/notosansbengali/NotoSansBengali%5Bwdth%2Cwght%5D.ttf" "$FONT_DIR/NotoSansBengali.ttf"
          download_font "https://raw.githubusercontent.com/google/fonts/main/ofl/balooda2/BalooDa2%5Bwght%5D.ttf" "$FONT_DIR/BalooDa2.ttf"
          download_font "https://raw.githubusercontent.com/google/fonts/main/ofl/hindsiliguri/HindSiliguri-Regular.ttf" "$FONT_DIR/HindSiliguri-Regular.ttf"
          download_font "https://raw.githubusercontent.com/google/fonts/main/ofl/hindsiliguri/HindSiliguri-Bold.ttf" "$FONT_DIR/HindSiliguri-Bold.ttf"
          download_font "https://raw.githubusercontent.com/google/fonts/main/ofl/tirobangla/TiroBangla-Regular.ttf" "$FONT_DIR/TiroBangla-Regular.ttf"

          ls -lh "$FONT_DIR"

      - name: ৬. Pure Native Release APK তৈরি ও স্থায়ী সিগনেচার (Same Signature) দিয়ে সাইন করা
        working-directory: ./native-android
        run: |
          gradle assembleRelease --no-daemon
          RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$RAW_APK" ]; then
            RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          echo "Using Release APK: $RAW_APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign" | sort -V | tail -n 1)

          if [ -n "$ZIPALIGN" ] && [ -n "$APKSIGNER" ] && [ -f "../android-keystore/hisab-release-key.p12" ]; then
            "$ZIPALIGN" -f -p 4 "$RAW_APK" ../hisab-calculator-aligned.apk
            "$APKSIGNER" sign \
              --ks ../android-keystore/hisab-release-key.p12 \
              --ks-key-alias hisabkey \
              --ks-pass pass:hisab123456 \
              --key-pass pass:hisab123456 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --out ../hisab-calculator.apk \
              ../hisab-calculator-aligned.apk
            rm -f ../hisab-calculator-aligned.apk
            "$APKSIGNER" verify --verbose ../hisab-calculator.apk
          else
            cp "$RAW_APK" ../hisab-calculator.apk
          fi

      - name: ৭. ডাউনলোডের জন্য APK ফাইল আপলোড (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-Calculator-Native-APK-v1.0.${{ github.run_number }}
          path: hisab-calculator.apk
          if-no-files-found: error

      - name: ৮. GitHub Releases-এ স্বয়ংক্রিয়ভাবে নতুন APK প্রকাশ (Auto Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          TITLE="হিসাব ক্যালকুলেটর v1.0.${{ github.run_number }} (Pure Native)"
          NOTES="🚀 **হিসাব ক্যালকুলেটর পিওর নেটিভ অ্যান্ড্রয়েড রিলিজ (সংস্করণ: v1.0.${{ github.run_number }}, বিল্ড: #${{ github.run_number }})**\n\n- ⚡ **০-মিলিসেকেন্ড ফাস্ট ওপেন:** সম্পূর্ণ নেটিভ Java ও Android Views দিয়ে তৈরি—আইকনে ক্লিক করার সাথে সাথেই ওপেন হবে।\n- 🌙 **AMOLED ব্ল্যাক ডার্ক মোড ও ৫টি অফলাইন বাংলা ফন্ট।**\n- ✅ **স্থায়ী সিগনেচার (Same Signature Key):** পুরোনো অ্যাপ আনইনস্টল না করেই সরাসরি আপডেট করা যাবে।"
          gh release create "$TAG" hisab-calculator.apk \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest || \
          gh release upload "$TAG" hisab-calculator.apk --clobber
