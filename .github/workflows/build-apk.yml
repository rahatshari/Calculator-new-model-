name: Build Android APK (হিসাব ক্যালকুলেটর)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android-apk:
    name: Build Hisab Calculator APK
    runs-on: ubuntu-latest

    steps:
      - name: ১. কোড চেকআউট (Checkout Repository)
        uses: actions/checkout@v4

      - name: ২. Node.js 22 সেটআপ
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ৩. Java JDK 21 সেটআপ (Android Gradle-এর জন্য)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: ৪. Android SDK সেটআপ ও লাইসেন্স অনুমোদন
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: ৫. প্রজেক্ট প্যাকেজ ইনস্টল ও ওয়েব বান্ডেল বিল্ড
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies = {
              "lucide-react": "latest",
              "react": "^19.0.0",
              "react-dom": "^19.0.0"
            };
            pkg.devDependencies = {
              "@tailwindcss/vite": "latest",
              "@types/node": "latest",
              "@types/react": "latest",
              "@types/react-dom": "latest",
              "@vitejs/plugin-react": "latest",
              "tailwindcss": "latest",
              "typescript": "latest",
              "vite": "latest",
              "vite-plugin-pwa": "latest"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          npm run build

      - name: ৬. Capacitor Android প্রজেক্ট কনফিগার ও সিঙ্ক
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --no-save --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: ৭. এআই লোগো দিয়ে Android APK আইকন সেটআপ
        run: |
          if [ -f "assets/icon.png" ] && command -v convert >/dev/null 2>&1; then
            convert assets/icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
            convert assets/icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png || true
            convert assets/icon.png -resize 108x108 android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png || true
            convert assets/icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
            convert assets/icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png || true
            convert assets/icon.png -resize 162x162 android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png || true
            convert assets/icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
            convert assets/icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png || true
            convert assets/icon.png -resize 216x216 android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png || true
            convert assets/icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
            convert assets/icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png || true
            convert assets/icon.png -resize 324x324 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png || true
            convert assets/icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
            convert assets/icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true
            convert assets/icon.png -resize 432x432 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png || true
          fi

      - name: ৮. Gradle দিয়ে Android APK তৈরি (Assemble APK)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../hisab-calculator.apk

      - name: ৯. ডাউনলোডের জন্য APK ফাইল আপলোড (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Hisab-Calculator-APK
          path: hisab-calculator.apk
          if-no-files-found: error
