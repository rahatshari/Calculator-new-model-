plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rahatsharif.hisabcalculator'
    compileSdk 34

    defaultConfig {
        applicationId "com.rahatsharif.hisabcalculator"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.1"

        buildConfigField "String", "GITHUB_REPO", "\"rahatshari/hisab-calculator\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.13.1'
}
