plugins {
    id 'com.android.application'
}

def envBuildNum = (System.getenv("BUILD_NUM") ?: "1").toInteger()
def envVersionName = (System.getenv("APP_VERSION") ?: "1.0.${envBuildNum}").toString()
def envRepoSlug = (System.getenv("GITHUB_REPOSITORY") ?: "rahatshari/Calculator-new-model-").toString()

android {
    namespace 'com.rahatsharif.hisabcalculator'
    compileSdk 34

    defaultConfig {
        applicationId "com.rahatsharif.hisabcalculator"
        minSdk 23
        targetSdk 34
        versionCode envBuildNum
        versionName envVersionName

        buildConfigField "String", "GITHUB_REPO", "\"${envRepoSlug}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.13.1'
}
